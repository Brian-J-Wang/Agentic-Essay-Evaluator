name: Agentic Essay Evaluator
description: >
  This repo was created for the Google Cloud Rapid Agent Hackathon. 
  It allows students to use google Gemini to review their essays against 
  their provided rubric and get feedback on what they can improve.
tech_stack:
  - Astro
  - React
  - Tailwind
  - MongoDB
  - ExpressJs
  - HTML
